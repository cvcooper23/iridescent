<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iridescent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-art"></div>
<div class="noise"></div>
<div class="scanlines"></div>

<main class="stage">

<p class="topline">observer connection unstable</p>

<div class="art-wrapper">

<img src="eye.png" class="main-art" alt="Iridescent artwork">

<button class="hidden-eye" id="hiddenEye"></button>

</div>

<section class="copy">

<h1 class="glitch" id="title">Iridescent</h1>

<div class="lyric-box">
<p id="statusText">a life was never broken</p>
</div>

<p class="release">06.12.26</p>

<div class="observer-ticker">
<span id="observerCount">127 observers connected</span>
</div>

</section>

<audio id="oceanPlayer" preload="auto" loop>
<source src="Ocean.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>

</main>
</body>
</html>
